services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "2001:80/tcp"
    environment:
      TZ: 'America/Denver'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_webserver_api_password: '${WEBSERVER_API_PASSWORD}'
      FTLCONF_misc_dnsmasq_lines: 'address=/*spencerdennison.com/192.168.1.4'
      FTLCONF_dns_upstreams: '1.1.1.1;1.0.0.1'
    volumes:
      - './pihole:/etc/pihole'
    networks:
      - proxy

networks:
  proxy:
    external: true
